[package]
name = "patient-balance-ai"
version = "0.1.0"
description = "PatientBalanceAI - Neuro-Rehabilitation & Balance Analysis Desktop Shell"
edition = "2021"

[lib]
name = "patient_balance_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hidapi = "2.6.7"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Win32_Devices_Bluetooth",
  "Win32_Foundation",
] }
windows-core = "0.62.2"
windows-collections = "0.3.2"
windows-future = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
