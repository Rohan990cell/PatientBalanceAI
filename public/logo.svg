<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="2.5"/>
  <!-- Equilibrium Rings -->
  <circle cx="50" cy="50" r="28" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="18" stroke="#0EA5E9" stroke-width="1.5" opacity="0.6"/>
  <!-- Dynamic Balance Vector -->
  <path d="M35 62 L50 32 L65 62" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center of Pressure Indicator -->
  <circle cx="50" cy="46" r="4.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="50" cy="46" r="2" fill="#FFFFFF"/>
</svg>
